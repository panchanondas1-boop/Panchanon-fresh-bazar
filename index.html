<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P - Panchanon Bazar</title>
<meta name="theme-color" content="#0a4d2e">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f3f6}
.top{background:#0a4d2e;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.logo{display:flex;gap:10px;align-items:center;font-weight:900}
.pbox{width:36px;height:36px;background:#ffeb3b;color:#0a4d2e;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.owner{width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center}
.search{margin:10px;background:#fff;border-radius:8px;padding:0 12px;display:flex;align-items:center}
.search input{flex:1;border:none;outline:none;padding:12px 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;max-width:900px;margin:0 auto 100px}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e0e0e0;display:flex;flex-direction:column}
.card img{width:100%;height:130px;object-fit:cover}
.card b{font-size:14px;padding:8px 10px 0}
.card span{font-size:12px;color:#666;padding:0 10px}
.price{color:#0a4d2e;font-weight:900;padding:4px 10px}
.add{margin:8px 10px 10px;background:#ffeb3b;border:none;padding:9px;border-radius:8px;font-weight:800}
.cart{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:12px;display:none;justify-content:space-between;align-items:center;z-index:80}
.ord{background:#fb641b;color:#fff;border:none;padding:11px 24px;border-radius:6px;font-weight:900}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:14px}
.box{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.inp{width:100%;padding:11px;border:1.5px solid #ddd;border-radius:8px;margin:5px 0}
.btn{width:100%;padding:13px;background:#0a4d2e;color:#fff;border:none;border-radius:8px;font-weight:800;margin-top:8px}
.bY{background:#ffeb3b;color:#000}
.lab{font-size:11px;font-weight:700;color:#555;margin-top:6px;display:block}
.badge{background:#0a4d2e;color:#fff;padding:3px 8px;border-radius:12px;font-size:12px}
</style>
</head>
<body>
<div class="top"><div class="logo"><div class="pbox">P</div>Panchanon Bazar <span id="totalBadge" class="badge">0</span></div><div style="display:flex;gap:8px;align-items:center"><div id="uShort" style="font-size:12px;display:none"></div><div class="owner" onclick="openOwner()">👑</div></div></div>
<div class="search"><span>🔍</span><input id="s" placeholder="10000 টা থেকে খুঁজুন..." oninput="draw()"></div>
<div class="grid" id="grid"></div>
<div class="cart" id="cartBar"><div id="cartInfo" style="font-weight:800"></div><button class="ord" onclick="orderNow()">অর্ডার করুন</button></div>
<div class="modal" id="userM" style="display:flex"><div class="box"><h3 style="text-align:center">একবার ডিটেইলস দাও</h3><label class="lab">নাম *</label><input id="uN" class="inp"><label class="lab">ফোন *</label><input id="uPh" class="inp"><div style="display:flex;gap:8px"><div style="flex:1"><label class="lab">গ্রাম</label><input id="uVil" class="inp"></div><div style="flex:1"><label class="lab">পাড়া</label><input id="uPara" class="inp"></div></div><div style="display:flex;gap:8px"><div style="flex:1"><label class="lab">থানা</label><input id="uTh" class="inp"></div><div style="flex:1"><label class="lab">জেলা</label><input id="uZil" class="inp"></div></div><label class="lab">পিন কোড *</label><input id="uPin" class="inp"><button class="btn bY" onclick="saveUser()">সেভ</button></div></div>
<div class="modal" id="ownM"><div class="box"><h3>মালিক লগইন</h3><input id="oE" class="inp" type="email" placeholder="Gmail"><input id="oP" class="inp" type="password" placeholder="Password"><div style="display:flex;gap:8px;margin-top:8px"><button onclick="closeOwner()" style="flex:1;padding:12px;background:#eee;border:none;border-radius:8px">বন্ধ</button><button onclick="loginOwner()" style="flex:1;padding:12px;background:#0a4d2e;color:#fff;border:none;border-radius:8px;font-weight:800">OK</button></div></div></div>
<div id="adminView" style="display:none;max-width:900px;margin:0 auto;padding:10px 10px 100px">
<div style="background:#fff;padding:12px;border-radius:12px;display:flex;justify-content:space-between"><b>মালিক প্যানেল - 10000</b><div><span id="dbCount" class="badge">0/10000</span> <button onclick="logoutOwner()" style="padding:6px 12px;background:#eee;border:none;border-radius:6px;margin-left:6px">Logout</button></div></div>
<div style="background:#fff;border-radius:12px;padding:12px;margin:10px 0"><h4>অর্ডার <span id="oCnt" style="background:#fb641b;color:#fff;padding:2px 8px;border-radius:10px;font-size:12px">0</span></h4><div id="oList"></div></div>
<div style="background:#e8f5e9;border:2px solid #0a4d2e;border-radius:14px;padding:14px;margin:10px 0">
<h4>নতুন মাল - 1 থেকে 10000 - অটো ছোট</h4>
<input id="pN" class="inp" placeholder="নাম - যেমন লাউ"><div style="display:flex;gap:8px"><input id="pW" class="inp" placeholder="কোয়ান্টিটি"><input id="pP" class="inp" type="number" placeholder="দাম"></div>
<div style="border:2px dashed #0a4d2e;background:#fff;border-radius:12px;padding:12px;text-align:center;margin:8px 0"><b>ফোন থেকে ছবি - অটো 300px ছোট</b><br><input type="file" id="pF" accept="image/*"><div id="imgStatus" style="font-size:12px;font-weight:700;color:#0a4d2e;margin:6px 0"></div><img id="pPrev" style="display:none;width:100%;height:140px;object-fit:cover;border-radius:8px;margin-top:8px"></div><button class="btn" onclick="addP()">সেভ - অটোমেটিক</button></div>
<div id="aList"></div></div>
<script>
var DB_NAME='P_Bazar_10000';var db=null;var prods=[];var cart=[];var orders=[];var user=null;var owner=false;var tImg='';
try{orders=JSON.parse(localStorage.getItem('pfb_orders_v2')||'[]');}catch(e){orders=[];}
try{user=JSON.parse(localStorage.getItem('pfb_user_v2')||'null');}catch(e){user=null;}
owner=localStorage.getItem('pfb_owner_v2')==='1';
function openDB(){return new Promise(function(res,rej){var req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains('products')){d.createObjectStore('products',{keyPath:'id',autoIncrement:true});}};req.onsuccess=function(e){db=e.target.result;res(db);};req.onerror=function(e){rej(e);};});}
function dbAdd(p){return new Promise(function(res,rej){var tx=db.transaction('products','readwrite');var req=tx.objectStore('products').add(p);req.onsuccess=function(){res(req.result);};req.onerror=function(e){rej(e);};});}
function dbGetAll(){return new Promise(function(res,rej){var tx=db.transaction('products','readonly');var req=tx.objectStore('products').getAll();req.onsuccess=function(){res(req.result);};req.onerror=function(e){rej(e);};});}
function dbDelete(id){return new Promise(function(res){var tx=db.transaction('products','readwrite');tx.objectStore('products').delete(id);tx.oncomplete=function(){res();};});}
function dbUpdate(id,upd){return new Promise(function(res){var tx=db.transaction('products','readwrite');var st=tx.objectStore('products');var g=st.get(id);g.onsuccess=function(){var data=g.result;if(data){for(var k in upd){data[k]=upd[k];}st.put(data);}};tx.oncomplete=function(){res();};});}
function compressImage(file,maxW,qual,cb){var reader=new FileReader();reader.onload=function(e){var img=new Image();img.onload=function(){var canvas=document.createElement('canvas');var w=img.width,h=img.height;if(w>maxW){h=h*(maxW/w);w=maxW;}if(h>maxW){w=w*(maxW/h);h=maxW;}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);cb(canvas.toDataURL('image/jpeg',qual));};img.src=e.target.result;};reader.readAsDataURL(file);}
async function init(){try{await openDB();var all=await dbGetAll();if(all.length===0){var base=[{name:'ওল',weight:'500gm',price:25,img:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300',active:true},{name:'গন্ধরাজ লেবু',weight:'2 pcs',price:15,img:'https://images.unsplash.com/photo-1587049352851-8d4e89133924?w=300',active:true}];for(var i=0;i<base.length;i++){await dbAdd(base[i]);}all=await dbGetAll();}prods=all;document.getElementById('totalBadge').innerText=prods.length;document.getElementById('dbCount').innerText=prods.length+'/10000';checkUser();draw();if(owner){showAdmin();}}catch(err){}}
function checkUser(){if(!user){document.getElementById('userM').style.display='flex';}else{document.getElementById('userM').style.display='none';document.getElementById('uShort').innerText=user.name.split(' ')[0];document.getElementById('uShort').style.display='block';}}
function saveUser(){var name=document.getElementById('uN').value.trim();var phone=document.getElementById('uPh').value.trim();var vil=document.getElementById('uVil').value.trim();var para=document.getElementById('uPara').value.trim();var th=document.getElementById('uTh').value.trim();var zil=document.getElementById('uZil').value.trim();var pin=document.getElementById('uPin').value.trim();if(!name||!phone||!pin){alert('নাম ফোন পিন দাও');return}user={name:name,phone:phone,village:vil,para:para,thana:th,zilla:zil,pin:pin};localStorage.setItem('pfb_user_v2',JSON.stringify(user));document.getElementById('userM').style.display='none';document.getElementById('uShort').innerText=name.split(' ')[0];document.getElementById('uShort').style.display='block';draw();}
function draw(){var g=document.getElementById('grid');var q=document.getElementById('s').value.toLowerCase();g.innerHTML='';var list=[];for(var i=0;i<prods.length;i++){if(prods[i].active){list.push(prods[i]);}}if(q){var f=[];for(var i=0;i<list.length;i++){if((list[i].name+list[i].weight).toLowerCase().indexOf(q)!==-1){f.push(list[i]);}}list=f;}for(var i=0;i<list.length && i<100;i++){var p=list[i];var d=document.createElement('div');d.className='card';d.innerHTML='<img src="'+p.img+'"><b>'+p.name+'</b><span>'+p.weight+'</span><div class="price">Rs'+p.price+'</div><button class="add" onclick="addCart('+p.id+')">ঝুড়িতে নিন</button>';g.appendChild(d);}}
function addCart(id){if(!user){document.getElementById('userM').style.display='flex';return}for(var i=0;i<prods.length;i++){if(prods[i].id===id){cart.push(prods[i]);break;}}upd();}
function upd(){var b=document.getElementById('cartBar');if(cart.length==0){b.style.display='none';return}b.style.display='flex';var tot=0;for(var i=0;i<cart.length;i++){tot+=cart[i].price;}document.getElementById('cartInfo').innerText=cart.length+' টা | Rs'+tot;}
function orderNow(){if(cart.length==0)return;if(!user){document.getElementById('userM').style.display='flex';return}var tot=0;for(var i=0;i<cart.length;i++){tot+=cart[i].price;}var ord={id:Date.now(),customer:user,items:cart.slice(),total:tot,time:new Date().toLocaleString('bn-IN')};orders.unshift(ord);if(orders.length>10000){orders=orders.slice(0,10000);}localStorage.setItem('pfb_orders_v2',JSON.stringify(orders));var msg='New Order Name:'+user.name+' Phone:'+user.phone+' '+user.village+' '+user.para+' '+user.thana+' '+user.zilla+' '+user.pin+' ';for(var i=0;i<cart.length;i++){msg+=cart[i].name+' '+cart[i].weight+' - Rs'+cart[i].price+' | ';}msg+=' Total Rs'+tot;window.open('https://wa.me/919933138395?text='+encodeURIComponent(msg),'_blank');cart=[];upd();if(owner){renderOrders();}}
function openOwner(){document.getElementById('ownM').style.display='flex';}
function closeOwner(){document.getElementById('ownM').style.display='none';}
function loginOwner(){var e=document.getElementById('oE').value.trim();var p=document.getElementById('oP').value.trim();if(e==='panchanon@gmail.com' && p==='1234'){owner=true;localStorage.setItem('pfb_owner_v2','1');closeOwner();showAdmin();}else{alert('ভুল!');}}
function showAdmin(){document.getElementById('grid').style.display='none';document.querySelector('.search').style.display='none';document.getElementById('adminView').style.display='block';renderAdmin();renderOrders();}
function logoutOwner(){owner=false;localStorage.removeItem('pfb_owner_v2');document.getElementById('adminView').style.display='none';document.getElementById('grid').style.display='grid';document.querySelector('.search').style.display='flex';draw();}
document.getElementById('pF').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var st=document.getElementById('imgStatus');st.innerText='অটো ছোট করা হচ্ছে...';compressImage(f,300,0.5,function(data){tImg=data;document.getElementById('pPrev').src=data;document.getElementById('pPrev').style.display='block';st.innerText='✅ অটো ছোট হয়ে গেছে - '+Math.round(data.length/1024)+'KB';});});
async function addP(){var n=document.getElementById('pN').value.trim();var w=document.getElementById('pW').value.trim()||'1 pcs';var pr=parseInt(document.getElementById('pP').value);if(!n||!pr){alert('নাম আর দাম দাও');return}if(!tImg){alert('ছবি সিলেক্ট করো');return}if(prods.length>=10000){alert('10000 হয়ে গেছে!');return}var obj={name:n,weight:w,price:pr,img:tImg,active:true};var id=await dbAdd(obj);obj.id=id;prods.push(obj);prods=await dbGetAll();document.getElementById('pN').value='';document.getElementById('pP').value='';document.getElementById('pW').value='';tImg='';document.getElementById('pPrev').style.display='none';document.getElementById('pF').value='';document.getElementById('totalBadge').innerText=prods.length;document.getElementById('dbCount').innerText=prods.length+'/10000';document.getElementById('imgStatus').innerText='';renderAdmin();draw();alert(n+' সেভ!');}
function renderAdmin(){var d=document.getElementById('aList');d.innerHTML='';var list=prods.slice().reverse();for(var i=0;i<list.length && i<100;i++){var p=list[i];var div=document.createElement('div');div.style.cssText='background:#fff;border:2px solid #0a4d2e;border-radius:12px;padding:10px;display:flex;gap:10px;margin:10px 0';div.innerHTML='<img src="'+p.img+'" style="width:60px;height:60px;border-radius:8px;object-fit:cover"><div style="flex:1"><b>'+p.id+'. '+p.name+'</b> '+(p.active?'ON':'OFF')+'<br><small>'+p.weight+' | Rs'+p.price+'</small><br><button onclick="tog('+p.id+')" style="padding:4px 8px;background:#ffeb3b;border:none;border-radius:6px">'+(p.active?'OFF':'ON')+'</button> <button onclick="delP('+p.id+')" style="padding:4px 8px;background:#d32f2f;color:#fff;border:none;border-radius:6px">Del</button></div>';d.appendChild(div);}}
async function tog(id){for(var i=0;i<prods.length;i++){if(prods[i].id===id){var newVal=!prods[i].active;await dbUpdate(id,{active:newVal});prods[i].active=newVal;break;}}renderAdmin();draw();}
async function delP(id){if(!confirm('ডিলিট?'))return;await dbDelete(id);var np=[];for(var i=0;i<prods.length;i++){if(prods[i].id!==id){np.push(prods[i]);}}prods=np;document.getElementById('totalBadge').innerText=prods.length;document.getElementById('dbCount').innerText=prods.length+'/10000';renderAdmin();draw();}
function renderOrders(){var d=document.getElementById('oList');var c1=document.getElementById('oCnt');if(c1) c1.innerText=orders.length;if(!d) return;if(orders.length==0){d.innerHTML='<p style=color:#999;padding:10px>অর্ডার নেই</p>';return}d.innerHTML='';for(var i=0;i<orders.length && i<100;i++){var o=orders[i];var div=document.createElement('div');div.style.cssText='background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;margin:8px 0';var items='';for(var j=0;j<o.items.length;j++){var it=o.items[j];var wt=it.weight||'';items+=it.name+' '+(wt?wt+' - ':'')+'Rs'+it.price+'<br>';}div.innerHTML='<div style="display:flex;justify-content:space-between"><b>#'+o.id.toString().slice(-5)+' '+o.customer.name+'</b><small>'+o.time+'</small></div><div style="font-size:12px;margin:4px 0">'+o.customer.phone+'<br>'+o.customer.village+' '+o.customer.para+' '+o.customer.thana+' '+o.customer.zilla+' '+o.customer.pin+'</div><div style="background:#f5f5f5;padding:8px;border-radius:6px;font-size:13px;line-height:1.8">'+items+'<br><b style="font-size:14px;color:#0a4d2e">Total Rs'+o.total+'</b></div><div style="display:flex;gap:6px;margin-top:8px"><a href="tel:'+o.customer.phone+'" style="flex:1;background:#0a4d2e;color:#fff;text-align:center;padding:10px;border-radius:6px;text-decoration:none;font-weight:bold">📞 Call</a><button onclick="delO('+i+')" style="flex:1;background:#d32f2f;color:#fff;border:none;padding:10px;border-radius:6px">Delete</button></div>';d.appendChild(div);}}
function delO(i){if(confirm('ডিলিট?')){orders.splice(i,1);localStorage.setItem('pfb_orders_v2',JSON.stringify(orders));renderOrders();}}
init();
</script>
</body>
</html>
