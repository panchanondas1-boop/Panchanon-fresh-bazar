<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P - 10000 Products</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a4d2e">
</head>
<body>
<script>
// IndexedDB - 10000 ছবি
let DB_NAME='P_Bazar_10000';
let db=null;
function openDB(){
 return new Promise((res)=>{
  let req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=e=>{
   let d=e.target.result;
   if(!d.objectStoreNames.contains('products')){
    d.createObjectStore('products',{keyPath:'id',autoIncrement:true});
   }
  };
  req.onsuccess=e=>{db=e.target.result;res(db);};
 });
}
function compressImage(file, cb){
 let reader=new FileReader();
 reader.onload=e=>{
  let img=new Image();
  img.onload=()=>{
   let canvas=document.createElement('canvas');
   let w=img.width,h=img.height,maxW=300;
   if(w>maxW){h=h*(maxW/w);w=maxW;}
   canvas.width=w;canvas.height=h;
   canvas.getContext('2d').drawImage(img,0,0,w,h);
   cb(canvas.toDataURL('image/jpeg',0.5));
  };
  img.src=e.target.result;
 };
 reader.readAsDataURL(file);
}
</script>
