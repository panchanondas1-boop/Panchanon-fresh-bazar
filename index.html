<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panchanon Fresh Bazar - টাটকা সবজি ও মুদিখানা</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans Bengali',sans-serif}</style>
</head>
<body class="bg-green-50">
<header class="bg-green-600 text-white p-4 sticky top-0 z-50 shadow">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<h1 class="text-xl font-bold">🥦 Panchanon Fresh Bazar</h1>
<div class="flex gap-3">
<a href="admin.html" class="bg-white text-green-700 px-3 py-1 rounded text-sm font-bold">Admin</a>
<button onclick="showCart()" class="bg-yellow-400 text-black px-3 py-1 rounded font-bold">🛒 <span id="cartCount">0</span></button>
</div>
</div>
</header>

<div class="max-w-6xl mx-auto p-4">
<div class="bg-white rounded-xl p-4 shadow mb-4 text-center">
<h2 class="text-2xl font-bold text-green-700">আজকের টাটকা বাজার</h2>
<p class="text-gray-600">দীঘা ও রামনগরে হোম ডেলিভারি - সকাল 8টা - রাত 9টা</p>
<a href="tel:1234567890" class="inline-block mt-2 bg-green-600 text-white px-6 py-2 rounded-full">📞 কল করুন</a>
</div>

<div class="flex gap-2 mb-4 overflow-auto">
<button onclick="filterCat('all')" class="cat-btn bg-green-600 text-white px-4 py-1 rounded-full whitespace-nowrap">সব</button>
<button onclick="filterCat('সবজি')" class="cat-btn bg-white px-4 py-1 rounded-full whitespace-nowrap">🥬 সবজি</button>
<button onclick="filterCat('মুদিখানা')" class="cat-btn bg-white px-4 py-1 rounded-full whitespace-nowrap">🛒 মুদিখানা</button>
<button onclick="filterCat('ফল')" class="cat-btn bg-white px-4 py-1 rounded-full whitespace-nowrap">🍎 ফল</button>
</div>

<div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
</div>

<div id="cartModal" class="fixed inset-0 bg-black/50 hidden z-[60] p-4">
<div class="bg-white max-w-md mx-auto mt-10 rounded-xl p-4 max-h-[80vh] overflow-auto">
<div class="flex justify-between items-center mb-3">
<h3 class="font-bold text-lg">আপনার ঝুড়ি</h3>
<button onclick="hideCart()" class="text-2xl">×</button>
</div>
<div id="cartItems"></div>
<div class="border-t mt-3 pt-3">
<p class="flex justify-between font-bold">মোট: <span id="total">0৳</span></p>
<input id="custName" placeholder="আপনার নাম" class="w-full border p-2 rounded mt-2">
<input id="custAddr" placeholder="ঠিকানা - দীঘা / রামনগর" class="w-full border p-2 rounded mt-2">
<button onclick="orderWhatsApp()" class="w-full bg-green-600 text-white py-3 rounded-xl mt-3 font-bold">WhatsApp এ অর্ডার করুন</button>
</div>
</div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('pfb_products') || 'null') || [
{name:"আলু - 1kg",price:28,cat:"সবজি",img:"https://images.unsplash.com/photo-1518977676608-bd36c2ca4f0d?w=300"},
{name:"পেঁয়াজ - 1kg",price:35,cat:"সবজি",img:"https://images.unsplash.com/photo-1587049352851-8d4e89133924?w=300"},
{name:"টমেটো - 500g",price:30,cat:"সবজি",img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=300"},
{name:"আটা - 5kg",price:230,cat:"মুদিখানা",img:"https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=300"},
{name:"সরিষার তেল - 1L",price:170,cat:"মুদিখানা",img:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=300"},
{name:"আপেল - 1kg",price:180,cat:"ফল",img:"https://images.unsplash.com/photo-1568702846914-96b305d2aa34?w=300"}
];
let cart=[];
let curCat='all';
function save(){localStorage.setItem('pfb_products',JSON.stringify(products))}
function render(){
 let cont=document.getElementById('products');
 cont.innerHTML='';
 products.filter(p=>curCat=='all'||p.cat==curCat).forEach((p,i)=>{
  cont.innerHTML+=`<div class="bg-white rounded-xl shadow overflow-hidden"><img src="${p.img}" class="h-28 w-full object-cover"><div class="p-2"><h3 class="font-bold text-sm">${p.name}</h3><p class="text-green-600 font-bold">${p.price}৳</p><p class="text-xs text-gray-500">${p.cat}</p><button onclick="addToCart(${i})" class="w-full mt-2 bg-green-600 text-white py-1 rounded">ঝুড়িতে নিন</button></div></div>`;
 });
}
function filterCat(c){
 curCat=c;
 document.querySelectorAll('.cat-btn').forEach(b=>b.className='cat-btn bg-white px-4 py-1 rounded-full whitespace-nowrap');
 event.target.className='cat-btn bg-green-600 text-white px-4 py-1 rounded-full whitespace-nowrap';
 render();
}
function addToCart(idx){
 let realIdx=products.indexOf(products.filter(p=>curCat=='all'||p.cat==curCat)[idx]);
 if(curCat!='all') realIdx = products.findIndex(p=>p.name==products.filter(p=>curCat=='all'||p.cat==curCat)[idx].name);
 cart.push(products[realIdx]);
 updateCart();
 alert('ঝুড়িতে যোগ হলো!');
}
function updateCart(){
 document.getElementById('cartCount').innerText=cart.length;
 let total=cart.reduce((s,p)=>s+p.price,0);
 document.getElementById('total').innerText=total+'৳';
 let html='';
 cart.forEach((p,i)=>{html+=`<div class="flex justify-between py-1 border-b"><span>${p.name}</span><span>${p.price}৳ <button onclick="cart.splice(${i},1);updateCart()" class="text-red-500 ml-2">x</button></span></div>`});
 document.getElementById('cartItems').innerHTML=html||'ঝুড়ি খালি';
}
function showCart(){document.getElementById('cartModal').classList.remove('hidden');updateCart()}
function hideCart(){document.getElementById('cartModal').classList.add('hidden')}
function orderWhatsApp(){
 let name=document.getElementById('custName').value||'Customer';
 let addr=document.getElementById('custAddr').value||'';
 if(cart.length==0)return alert('ঝুড়ি খালি!');
 let total=cart.reduce((s,p)=>s+p.price,0);
 let msg=`*Panchanon Fresh Bazar - নতুন অর্ডার*%0Aনাম: ${name}%0Aঠিকানা: ${addr}%0A%0A`+cart.map(p=>`- ${p.name} - ${p.price}৳`).join('%0A')+`%0A%0Aমোট: ${total}৳`;
 window.open(`https://wa.me/919999999999?text=${msg}`,'_blank');
 cart=[];updateCart();hideCart();
 alert('WhatsApp এ চলে যান, অর্ডার পাঠান!');
}
render();updateCart();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
