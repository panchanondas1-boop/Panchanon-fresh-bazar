<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Panchanon Fresh Bazar</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-2xl mx-auto">
<div class="flex justify-between items-center mb-4">
<h1 class="text-xl font-bold">🔧 Admin Panel</h1>
<a href="index.html" class="bg-green-600 text-white px-4 py-1 rounded">দোকান দেখুন</a>
</div>

<div class="bg-white p-4 rounded-xl shadow mb-4">
<h2 class="font-bold mb-2">নতুন পণ্য যোগ করুন</h2>
<input id="pName" placeholder="পণ্যের নাম - যেমন: আলু 1kg" class="w-full border p-2 rounded mb-2">
<input id="pPrice" type="number" placeholder="দাম - যেমন: 28" class="w-full border p-2 rounded mb-2">
<select id="pCat" class="w-full border p-2 rounded mb-2">
<option value="সবজি">সবজি</option>
<option value="মুদিখানা">মুদিখানা</option>
<option value="ফল">ফল</option>
<option value="মাছ-মাংস">মাছ-মাংস</option>
</select>
<input id="pImg" placeholder="ছবির লিংক (না দিলে অটো ছবি আসবে)" class="w-full border p-2 rounded mb-2">
<button onclick="addProduct()" class="w-full bg-green-600 text-white py-2 rounded font-bold">➕ যোগ করুন</button>
</div>

<div class="bg-white p-4 rounded-xl shadow">
<h2 class="font-bold mb-2">সব পণ্য (<span id="count">0</span> টা)</h2>
<div id="list"></div>
<button onclick="resetShop()" class="mt-4 text-sm text-red-500">🔄 দোকান রিসেট করুন (ডিফল্ট মাল আনুন)</button>
</div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('pfb_products') || 'null') || [
{name:"আলু - 1kg",price:28,cat:"সবজি",img:"https://images.unsplash.com/photo-1518977676608-bd36c2ca4f0d?w=300"},
{name:"পেঁয়াজ - 1kg",price:35,cat:"সবজি",img:"https://images.unsplash.com/photo-1587049352851-8d4e89133924?w=300"},
{name:"টমেটো - 500g",price:30,cat:"সবজি",img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=300"},
{name:"আটা - 5kg",price:230,cat:"মুদিখানা",img:"https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=300"},
{name:"সরিষার তেল - 1L",price:170,cat:"মুদিখানা",img:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=300"},
{name:"আপেল - 1kg",price:180,cat:"ফল",img:"https://images.unsplash.com/photo-1568702846914-96b305d2aa34?w=300"}
];
function save(){localStorage.setItem('pfb_products',JSON.stringify(products)); render();}
function render(){
 document.getElementById('count').innerText=products.length;
 document.getElementById('list').innerHTML=products.map((p,i)=>`
 <div class="flex justify-between items-center border-b py-2">
 <div><b>${p.name}</b> - ${p.price}৳ <small class="text-gray-500">(${p.cat})</small></div>
 <button onclick="del(${i})" class="bg-red-500 text-white px-2 py-1 rounded text-sm">Delete</button>
 </div>`).join('');
}
function addProduct(){
 let name=document.getElementById('pName').value;
 let price=parseInt(document.getElementById('pPrice').value);
 let cat=document.getElementById('pCat').value;
 let img=document.getElementById('pImg').value || `https://via.placeholder.com/300?text=${encodeURIComponent(name)}`;
 if(!name||!price)return alert('নাম আর দাম দিন!');
 products.unshift({name,price,cat,img});
 save();
 document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pImg').value='';
 alert('যোগ হয়ে গেছে! দোকানে চলে গেছে!');
}
function del(i){if(confirm('ডিলিট করবে?')){products.splice(i,1);save()}}
function resetShop(){if(confirm('সব ডিলিট হয়ে ডিফল্ট মাল আসবে, করবে?')){localStorage.removeItem('pfb_products');location.reload()}}
render();
</script>
</body>
</html>
